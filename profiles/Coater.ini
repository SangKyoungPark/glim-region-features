; Coater.ini - Coater process defect profile (initial hypothesis, tune with field data)
; Spec chapter 9. All comments ASCII to avoid CP949 mis-decode.
; Coordinate note: position features are (row, col); this file only uses scalar features.

[Profile]
name = Coater

; Score normalization: feature = vMin, vMax, direction(inc|dec)
[Score]
circularity   = 0.30, 1.00, inc
area          = 10, 5000, inc
convexity     = 0.50, 1.00, inc
compactness   = 1.00, 5.00, inc
roundness     = 0.50, 1.00, inc
anisometry    = 1.00, 5.00, inc

; Defect codes evaluated by the rule engine (priority ascending)
[SelectShape]
codes = PINHOLE, BUBBLE, TEAR, UNCOATED

; Pinhole: small, round hole-like spot
[Rule_PINHOLE]
combine  = AND
priority = 10
circularity = 0.70, 1.00
area        = 5, 300

; Bubble cluster: multiple holes inside a blob (euler <= -1)
[Rule_BUBBLE]
combine  = AND
priority = 20
holes        = 2, 100000
area         = 200, 5000000

; Tear / Island: concave, low convexity, larger area
[Rule_TEAR]
combine  = AND
priority = 30
convexity   = 0.00, 0.65
area        = 100, 5000000

; Uncoated area: large low-circularity region
[Rule_UNCOATED]
combine  = AND
priority = 40
area         = 2000, 100000000
circularity  = 0.00, 0.60
