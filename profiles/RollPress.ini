; RollPress.ini - Roll-press process defect profile (initial hypothesis)
; Spec chapter 9. Comments ASCII only.

[Profile]
name = RollPress

[Score]
anisometry     = 1.00, 8.00, inc
rectangularity = 0.30, 1.00, inc
contlength     = 20, 3000, inc
compactness    = 1.00, 10.00, inc
area           = 20, 20000, inc
structure_factor = 0.00, 10.00, inc

[SelectShape]
codes = WRINKLE, CRACK, PRESSED_FOREIGN

; Wrinkle: very elongated, high anisometry
[Rule_WRINKLE]
combine  = AND
priority = 10
anisometry = 3.50, 1000.0
area       = 100, 5000000

; Crack: extremely thin/long, high anisometry + high compactness
[Rule_CRACK]
combine  = AND
priority = 20
anisometry  = 5.00, 1000.0
compactness = 3.00, 100000.0

; Pressed foreign matter: compact rectangular-ish blob
[Rule_PRESSED_FOREIGN]
combine  = AND
priority = 30
rectangularity = 0.75, 1.00
anisometry     = 1.00, 2.50
area           = 50, 5000000
