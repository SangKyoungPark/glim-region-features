; Slitter.ini - Slitter process defect profile (initial hypothesis)
; Spec chapter 9. Comments ASCII only. Burr = jagged edge -> low roundness, higher sides.

[Profile]
name = Slitter

[Score]
roundness   = 0.50, 1.00, dec
sides       = 3.00, 40.00, inc
contlength  = 20, 3000, inc
diameter    = 10, 2000, inc
compactness = 1.00, 8.00, inc
area        = 20, 50000, inc

[SelectShape]
codes = BURR, CUT_DEFECT

; Burr: jagged contour, low roundness and many estimated sides
[Rule_BURR]
combine  = AND
priority = 10
roundness = 0.00, 0.85
sides     = 8.00, 100000.0
area      = 30, 5000000

; Cut-surface defect: elongated along cut line, long contour
[Rule_CUT_DEFECT]
combine  = AND
priority = 20
anisometry = 2.50, 100000.0
contlength = 150, 5000000
